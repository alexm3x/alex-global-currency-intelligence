<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>AGCI Morning Intelligence | Archivo</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../morning-intelligence.css"><style>body{background:#f4f2ef;color:#17191c}.podcast-archive{max-width:980px;margin:auto;padding:28px 18px 60px}.podcast-archive header{border-top:4px solid #8f1d24;padding-top:18px}.podcast-archive h1{font-family:Georgia,serif;font-size:40px;margin:8px 0}.episode-card{background:#fff;border:1px solid #d8d3cd;padding:18px;margin:16px 0}.episode-card__meta{font-size:11px;color:#777;text-transform:uppercase}.episode-card a,.episode-card button{display:inline-block;margin:8px 7px 0 0;padding:8px 10px;border:1px solid #222;background:#222;color:#fff;text-decoration:none;cursor:pointer}.transcript{margin-top:18px;border-top:1px solid #ddd;padding-top:18px}.transcript article{margin:18px 0}.transcript time{color:#8f1d24;font-weight:700}@media(max-width:600px){.podcast-archive h1{font-size:31px}}</style></head><body><main class="podcast-archive"><header><p class="rubric">AGCI MORNING INTELLIGENCE</p><h1>Archivo de episodios</h1><p>Audio ejecutivo, transcripciones y vínculo con el Daily Strategic Briefing.</p><a href="../">← Volver a AGCI</a></header><section id="episodes"><p>Cargando archivo…</p></section><section id="transcript" class="transcript"></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=s=>`${Math.floor(s/60)}:${String(Math.round(s)%60).padStart(2,'0')}`;async function load(){const a=await fetch('archive.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});document.querySelector('#episodes').innerHTML=a.episodes.map(e=>`<article class="episode-card"><div class="episode-card__meta">${esc(e.date)} · ${fmt(e.durationSeconds)} · ${esc(e.status)}</div><h2>${esc(e.title)}</h2><button data-data="${esc(e.dataUrl)}">Ver transcripción</button>${e.audioUrl?`<a href="${esc(e.audioUrl)}">Escuchar audio</a>`:''}${e.pdfUrl?`<a href="${esc(e.pdfUrl)}">PDF</a>`:''}</article>`).join('');document.querySelectorAll('[data-data]').forEach(b=>b.onclick=()=>show(b.dataset.data));if(new URLSearchParams(location.search).get('transcript'))show('latest.json')}async function show(url){const d=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});document.querySelector('#transcript').innerHTML=`<h2>Transcripción — ${esc(d.date)}</h2><h3>${esc(d.title)}</h3>`+d.chapters.map(c=>`<article><time>${fmt(c.start)}</time><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></article>`).join('');location.hash='transcript'}load().catch(()=>document.querySelector('#episodes').innerHTML='<p>No fue posible cargar el archivo.</p>');</script></body></html>
