name: Deploy AGCI to GitHub Pages
on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.github/workflows/update-structural-data.yml'
      - 'scripts/update-structural-data.mjs'
      - 'tests/structural-data.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
