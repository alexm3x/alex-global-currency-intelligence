name: Deploy AGCI to GitHub Pages
on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.github/workflows/update-structural-data.yml'
      - 'scripts/update-structural-data.mjs'
      - 'tests/structural-data.test.mjs'
      - 'docs/status/viajes-intelligence-production.json'
      - 'docs/status/viajes-pages-production.json'
      - 'docs/status/viajes-toolchain-security.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Audit and verify Viajes ASC artifact before publication
        run: |
          npm ci
          npm test
          node scripts/audit-viajes-site.mjs
          node --check viajes/travel-assistant.js
          node --check viajes/travel-assistant-core.js
          node --check viajes/travel-intelligence-core.js
          node --check viajes/travel-intelligence.js
          node --check viajes/travel-window-engine.js
          node --check viajes/travel-logistics-core.js
          node --check viajes/travel-logistics.js
          node --check viajes/travel-itinerary-core.js
          node --check viajes/travel-itinerary.js
          node --check viajes/travel-cost-core.js
          node --check viajes/travel-cost.js
          grep -q 'VIAJES ASC' viajes/index.html
          grep -q 'YA SÉ CUÁNDO VIAJO' viajes/travel-assistant.js
          grep -q 'travel-intelligence-core.js' viajes/travel-assistant.js
          grep -q 'asc-travel-intelligence-v1' viajes/travel-intelligence-core.js
          grep -q 'travel-window-engine.js' viajes/travel-intelligence.js
          grep -q 'research_windows' viajes/travel-window-engine.js
          grep -q 'viajes:window-selected' viajes/travel-window-engine.js
          grep -q 'travel-logistics-core.js' viajes/travel-intelligence.js
          grep -q 'travel-logistics.js' viajes/travel-intelligence.js
          grep -q 'asc-travel-logistics-v1' viajes/travel-logistics-core.js
          grep -q 'viajes:logistics-ready' viajes/travel-logistics.js
          grep -q 'travel-itinerary-core.js' viajes/travel-logistics.js
          grep -q 'travel-itinerary.js' viajes/travel-logistics.js
          grep -q 'travel-cost-core.js' viajes/travel-logistics.js
          grep -q 'travel-cost.js' viajes/travel-logistics.js
          grep -q 'asc-travel-itinerary-v1' viajes/travel-itinerary-core.js
          grep -q 'viajes:itinerary-ready' viajes/travel-itinerary.js
          grep -q 'asc-travel-cost-v1' viajes/travel-cost-core.js
          grep -q 'viajes:cost-ready' viajes/travel-cost.js
          grep -q 'viajes-asc-assistant.proadmexico.workers.dev' viajes/travel-intelligence.js
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check custom-domain reachability independently
        shell: bash
        run: |
          set +e
          code=$(curl --silent --show-error --location --max-time 20 -o /tmp/custom-viajes.html -w '%{http_code}' 'https://alexsaldana.com/viajes/' 2>/tmp/custom-curl-error.txt)
          if [ "$code" = "200" ] && grep -q 'VIAJES ASC' /tmp/custom-viajes.html; then
            echo 'CUSTOM_DOMAIN_REACHABLE=1' >> "$GITHUB_ENV"
            echo 'Custom domain verified.'
          else
            echo 'CUSTOM_DOMAIN_REACHABLE=0' >> "$GITHUB_ENV"
            echo "Custom domain not independently reachable; HTTP=${code:-000}. GitHub Pages deployment itself already succeeded."
            cat /tmp/custom-curl-error.txt || true
          fi
          exit 0
      - name: Persist public verification status
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p docs/status
          node <<'NODE'
          const fs=require('fs');
          const status={schemaVersion:1,service:'viajes-asc-pages',status:'verified',phase:8,phase7Contract:'asc-travel-itinerary-v1',phase8Contract:'asc-travel-cost-v1',commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,verifiedAt:new Date().toISOString(),pagesDeploymentSucceeded:true,pagesUrl:process.env.PAGES_URL||null,artifactVerifiedBeforeDeployment:true,customDomainUrl:'https://alexsaldana.com/viajes/',customDomainReachable:process.env.CUSTOM_DOMAIN_REACHABLE==='1',assets:['travel-assistant.js','travel-intelligence-core.js','travel-intelligence.js','travel-window-engine.js','travel-logistics-core.js','travel-logistics.js','travel-itinerary-core.js','travel-itinerary.js','travel-cost-core.js','travel-cost.js']};
          fs.writeFileSync('docs/status/viajes-pages-production.json',JSON.stringify(status,null,2)+'\n');
          NODE
          git config user.name "viajes-asc-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/viajes-pages-production.json
          git commit -m "status(viajes): verify public Pages deployment" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
