name: Deploy AGCI to GitHub Pages · Viajes Release
on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.github/workflows/update-structural-data.yml'
      - 'scripts/update-structural-data.mjs'
      - 'tests/structural-data.test.mjs'
      - 'docs/status/viajes-intelligence-production.json'
      - 'docs/status/viajes-pages-production.json'
      - 'docs/status/viajes-toolchain-security.json'
      - 'docs/status/viajes-qa-production.json'
      - 'docs/status/viajes-release-production.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_URL: https://viajes-asc-assistant.proadmexico.workers.dev
      CUSTOM_DOMAIN_URL: https://alexsaldana.com/viajes/
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Phase 11 · Institutional QA gate
        run: |
          npm ci
          npm test
          node scripts/audit-viajes-site.mjs
          node scripts/qa-viajes-release.mjs --output /tmp/viajes-qa.json
          node --check viajes/travel-assistant.js
          node --check viajes/travel-assistant-core.js
          node --check viajes/travel-intelligence-core.js
          node --check viajes/travel-intelligence.js
          node --check viajes/travel-window-engine.js
          node --check viajes/travel-logistics-core.js
          node --check viajes/travel-logistics.js
          node --check viajes/travel-itinerary-core.js
          node --check viajes/travel-itinerary.js
          node --check viajes/travel-cost-core.js
          node --check viajes/travel-cost.js
          node --check viajes/travel-pdf-core.js
          node --check viajes/travel-pdf.js
          node --check viajes/travel-integration-core.js
          node --check viajes/travel-integration.js
          node --check scripts/qa-viajes-release.mjs
          node --check scripts/verify-viajes-production.mjs
          node -e "const m=require('./viajes/release-manifest.json');if(m.phase!==13||m.release!=='asc-viajes-phase13-2026-08-19')process.exit(1)"
          grep -q 'VIAJES ASC' viajes/index.html
          grep -q 'YA SÉ CUÁNDO VIAJO' viajes/travel-assistant.js
          grep -q 'asc-travel-intelligence-v1' viajes/travel-intelligence-core.js
          grep -q 'research_windows' viajes/travel-window-engine.js
          grep -q 'asc-travel-logistics-v1' viajes/travel-logistics-core.js
          grep -q 'asc-travel-itinerary-v1' viajes/travel-itinerary-core.js
          grep -q 'asc-travel-cost-v1' viajes/travel-cost-core.js
          grep -q 'asc-travel-pdf-v1' viajes/travel-pdf-core.js
          grep -q 'asc-travel-integration-v1' viajes/travel-integration-core.js
          grep -q 'Notificación externa: NO ACTIVA' viajes/travel-integration.js
          echo 'PHASE11_QA_PASSED=1' >> "$GITHUB_ENV"
      - name: Phase 12 · Configure Pages
        uses: actions/configure-pages@v6
      - name: Phase 12 · Upload consolidated release artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: "."
      - name: Phase 12 · Publish consolidated release
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Phase 13 · Verify production runtime
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_DEPLOYMENT_SUCCEEDED: '1'
        run: |
          node scripts/verify-viajes-production.mjs --output /tmp/viajes-release-verification.json
          cat /tmp/viajes-release-verification.json
      - name: Phase 13 · Persist final release evidence
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p docs/status
          node <<'NODE'
          const fs=require('fs');
          const qa=JSON.parse(fs.readFileSync('/tmp/viajes-qa.json','utf8'));
          const release=JSON.parse(fs.readFileSync('/tmp/viajes-release-verification.json','utf8'));
          const base={schemaVersion:1,release:'asc-viajes-phase13-2026-08-19',phase:13,commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,verifiedAt:new Date().toISOString()};
          const pages={...base,service:'viajes-asc-pages',status:release.status,phase11QaPassed:qa.status==='passed',phase12PublicationSucceeded:true,phase13VerificationStatus:release.status,pagesDeploymentSucceeded:true,pagesUrl:process.env.PAGES_URL||null,pagesRoute:release.phase12.pagesRoute,pagesRuntime:release.phase13.pages,artifactVerifiedBeforeDeployment:true,customDomainUrl:release.phase13.customDomain.url,customDomainReachable:release.phase13.customDomain.ok,externalBlockers:release.phase13.externalBlockers,phase9Contract:'asc-travel-pdf-v1',phase10Contract:'asc-travel-integration-v1',assets:['travel-assistant-core.js','travel-assistant.js','travel-intelligence-core.js','travel-intelligence.js','travel-window-engine.js','travel-logistics-core.js','travel-logistics.js','travel-itinerary-core.js','travel-itinerary.js','travel-cost-core.js','travel-cost.js','travel-pdf-core.js','travel-pdf.js','travel-integration-core.js','travel-integration.js','release-manifest.json']};
          fs.writeFileSync('docs/status/viajes-qa-production.json',JSON.stringify({...base,...qa,commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID},null,2)+'\n');
          fs.writeFileSync('docs/status/viajes-release-production.json',JSON.stringify({...base,...release,commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID},null,2)+'\n');
          fs.writeFileSync('docs/status/viajes-pages-production.json',JSON.stringify(pages,null,2)+'\n');
          NODE
          git config user.name "viajes-asc-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status/viajes-qa-production.json docs/status/viajes-release-production.json docs/status/viajes-pages-production.json
          git commit -m "status(viajes): verify phase 13 release" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Release summary
        run: |
          echo '### Viajes ASC · Fases 11–13' >> "$GITHUB_STEP_SUMMARY"
          echo '- Phase 11: institutional QA passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Phase 12: consolidated GitHub Pages artifact published' >> "$GITHUB_STEP_SUMMARY"
          echo '- Phase 13: Pages + Worker + CORS + runtime state verified' >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/viajes-release-verification.json'));console.log('- Final status: '+r.status);console.log('- External blockers: '+(r.phase13.externalBlockers.join(', ')||'none'))" >> "$GITHUB_STEP_SUMMARY"
