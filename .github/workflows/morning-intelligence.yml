name: AGCI Morning Intelligence Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "20 14 * * *"
  push:
    branches: ["main"]
    paths:
      # Fuente canónica y cualquier variante editorial del briefing.
      # Los archivos generados bajo podcast/ NO están incluidos para evitar bucles.
      - "data/daily-briefing-latest.json"
      - "data/daily-briefing*.json"
      - "daily-briefing-cover.js"
      - "daily-briefing*.md"
      - "briefing/**"
      - "scripts/generate-morning-intelligence-4min.mjs"
      - "scripts/render-google-chirp.mjs"
      - "scripts/apply-chirp-metadata.mjs"
      - ".github/workflows/morning-intelligence.yml"
      - "voice-studio.js"
  pull_request:
    branches: ["main"]
    paths:
      - "data/daily-briefing-latest.json"
      - "data/daily-briefing*.json"
      - "daily-briefing-cover.js"
      - "daily-briefing*.md"
      - "briefing/**"
      - "scripts/generate-morning-intelligence-4min.mjs"
      - "scripts/render-google-chirp.mjs"
      - "scripts/apply-chirp-metadata.mjs"
      - ".github/workflows/morning-intelligence.yml"
      - "voice-studio.js"

permissions:
  contents: write
  actions: write
  id-token: write

# Si el texto cambia de nuevo mientras se sintetiza un episodio, se cancela la
# versión anterior para que el MP3 publicado corresponda siempre al último texto.
concurrency:
  group: morning-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      CHIRP_CIO_VOICE: es-US-Chirp3-HD-Achird
      CHIRP_ANALYST_VOICE: es-US-Chirp3-HD-Achernar
      CHIRP_LANGUAGE: es-US
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar briefing canónico y guion ejecutivo
        run: |
          node --check scripts/generate-morning-intelligence-4min.mjs
          node --check scripts/render-google-chirp.mjs
          node --check scripts/apply-chirp-metadata.mjs
          node scripts/generate-morning-intelligence-4min.mjs
          test -s podcast/generated/script.txt
          test -s podcast/generated/render-plan.json
          test -s podcast/latest.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('data/daily-briefing-latest.json'));if(x.schemaVersion!==2||x.language!=='es-MX'||!x.audio?.chapters?.length||x.audio.chapters.length<7)process.exit(1)"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('podcast/generated/render-plan.json'));if(p.schemaVersion!==3||p.totalWords<330||p.totalWords>520||p.segments.length<7)process.exit(1)"
          DATE=$(node -p "JSON.parse(require('fs').readFileSync('data/daily-briefing-latest.json')).date")
          SOURCE_SHA=$(sha256sum data/daily-briefing-latest.json | cut -d' ' -f1)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Instalar herramientas de audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg
          ffmpeg -version | head -n 1

      - id: google_auth
        name: Autenticar Google Cloud para Chirp 3 HD
        if: env.GCP_CREDENTIALS != '' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configurar Google Cloud SDK
        if: env.GCP_CREDENTIALS != '' && steps.google_auth.outcome == 'success' && github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - id: chirp
        name: Renderizar edición con Google Chirp 3 HD
        if: env.GCP_CREDENTIALS != '' && steps.google_auth.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-google-chirp.mjs
          test -s podcast/generated/chirp-result.json
          AUDIO_URL=$(node -p "JSON.parse(require('fs').readFileSync('podcast/generated/chirp-result.json')).audioUrl")
          DURATION=$(node -p "JSON.parse(require('fs').readFileSync('podcast/generated/chirp-result.json')).durationSeconds")
          DURATIONS_JSON=$(node -p "JSON.stringify(JSON.parse(require('fs').readFileSync('podcast/generated/chirp-result.json')).chapterDurations)")
          AUDIO_DURATION_SECONDS="$DURATION" AUDIO_URL="$AUDIO_URL" CHAPTER_DURATIONS_JSON="$DURATIONS_JSON" node scripts/generate-morning-intelligence-4min.mjs
          node scripts/apply-chirp-metadata.mjs
          echo "AUDIO_URL=$AUDIO_URL" >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "AUDIO_ENGINE=Google Chirp 3 HD" >> "$GITHUB_ENV"

      - name: Renderizar MP3 fallback open-source
        if: env.GCP_CREDENTIALS == '' || steps.google_auth.outcome != 'success' || steps.chirp.outcome != 'success' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          YEAR=${DATE:0:4}
          MONTH=${DATE:5:2}
          OUT_DIR="podcast/episodes/$YEAR/$MONTH"
          mkdir -p "$OUT_DIR"
          : > /tmp/concat.txt
          : > /tmp/durations.txt
          node - <<'NODE' > /tmp/render-plan.tsv
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('podcast/generated/render-plan.json'));
          for(const s of p.segments) console.log([s.index,s.speaker,s.voice,s.file].join('\t'));
          NODE
          while IFS=$'\t' read -r INDEX SPEAKER VOICE FILE; do
            WAV="/tmp/agci-segment-${INDEX}.wav"
            if [ "$SPEAKER" = "CIO" ]; then SPEED=165; PITCH=42; else SPEED=170; PITCH=48; fi
            espeak-ng -v "$VOICE" -s "$SPEED" -p "$PITCH" -a 155 -f "$FILE" -w "$WAV"
            test -s "$WAV"
            printf "file '%s'\n" "$WAV" >> /tmp/concat.txt
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$WAV" >> /tmp/durations.txt
          done < /tmp/render-plan.tsv
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i /tmp/concat.txt -c:a pcm_s16le /tmp/agci-fallback.wav
          ffmpeg -y -hide_banner -loglevel error -i /tmp/agci-fallback.wav -af "highpass=f=70,lowpass=f=9000,loudnorm=I=-16:TP=-1.5:LRA=8" -ar 44100 -ac 1 -codec:a libmp3lame -b:a 96k "$OUT_DIR/$DATE.mp3"
          test -s "$OUT_DIR/$DATE.mp3"
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT_DIR/$DATE.mp3")
          DURATIONS_JSON=$(node -e "const fs=require('fs');const a=fs.readFileSync('/tmp/durations.txt','utf8').trim().split(/\n+/).filter(Boolean).map(Number);process.stdout.write(JSON.stringify(a))")
          AUDIO_URL="podcast/episodes/$YEAR/$MONTH/$DATE.mp3"
          AUDIO_DURATION_SECONDS="$DURATION" AUDIO_URL="$AUDIO_URL" CHAPTER_DURATIONS_JSON="$DURATIONS_JSON" node scripts/generate-morning-intelligence-4min.mjs
          echo "AUDIO_URL=$AUDIO_URL" >> "$GITHUB_ENV"
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          echo "AUDIO_ENGINE=Fallback eSpeak" >> "$GITHUB_ENV"

      - name: Validar paquete de episodio
        run: |
          test -s "$AUDIO_URL"
          test -s podcast/feed.xml
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('podcast/latest.json'));if(p.schemaVersion!==3||p.status!=='published'||p.durationSeconds>260||p.durationSeconds<90||p.chapters.length<7||!p.audioUrl)process.exit(1);if(p.chapters.some((c,i,a)=>!c.speaker||i>0&&Number(c.start)<=Number(a[i-1].start)))process.exit(1)"
          if [ "$AUDIO_ENGINE" = "Google Chirp 3 HD" ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('podcast/latest.json'));if(p.primaryPlayback!=='publishedAudio'||p.voiceMode!=='google-chirp3-hd'||p.audioEngine?.model!=='Chirp 3 HD')process.exit(1)"
          fi

      - name: Publicar audio y metadatos generados
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "agci-morning-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast/latest.json podcast/archive.json podcast/feed.xml podcast/generated podcast/episodes
          if git diff --cached --quiet; then
            echo "No hay cambios de episodio que publicar."
            echo "PUBLISHED=0" >> "$GITHUB_ENV"
          else
            git commit -m "podcast: sync audio with briefing $DATE via $AUDIO_ENGINE"
            git push origin HEAD:main
            echo "PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      - name: Desplegar edición publicada en GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.PUBLISHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Resumen de producción
        run: |
          echo "### AGCI Morning Intelligence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fecha: $DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Motor: ${AUDIO_ENGINE:-Fallback eSpeak}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duración: ${DURATION:-N/A} segundos" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hash del texto fuente: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sincronización: audio regenerado desde el briefing vigente" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voz CIO objetivo: $CHIRP_CIO_VOICE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voz Analista objetivo: $CHIRP_ANALYST_VOICE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Google configurado: ${{ env.GCP_CREDENTIALS != '' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fallback automático: habilitado" >> "$GITHUB_STEP_SUMMARY"
