name: Update AGCI structural data

on:
  schedule:
    - cron: "33 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-structural-data.mjs'
      - 'tests/structural-data.test.mjs'
      - '.github/workflows/update-structural-data.yml'
      - 'package.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agci-structural-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - name: Run contract tests
        run: npm test
      - name: Fetch and validate official datasets
        run: npm run update:data
      - name: Validate generated contracts
        run: |
          node -e "const fs=require('fs'); for (const file of ['data/macro-latest.json','data/sources.json']) JSON.parse(fs.readFileSync(file,'utf8'));"
          node -e "const x=require('./data/macro-latest.json'); if (!['connected','degraded'].includes(x.overallStatus)) process.exit(1); if (!Object.values(x.providers).some(p=>p.data)) process.exit(1);"
      - name: Publish changed observations
        run: |
          if git diff --quiet -- data/macro-latest.json data/sources.json; then
            echo "Official sources returned no material change."
            exit 0
          fi
          git config user.name "agci-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro-latest.json data/sources.json
          git commit -m "data: refresh structural indicators"

          # Another AGCI workflow or an authorized user may update main while
          # this job is fetching official data. Rebase safely and retry the
          # push instead of failing on a normal non-fast-forward race.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying publish (${attempt}/3)..."
            sleep $((attempt * 3))
          done

          echo "Unable to publish structural observations after 3 retries."
          exit 1
      - name: Build clean Pages artifact
        run: |
          mkdir -p /tmp/agci-pages
          git archive HEAD | tar -x -C /tmp/agci-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/agci-pages
      - name: Deploy refreshed data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm published structural snapshot
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 12 --retry-delay 5 --retry-max-time 90 --retry-all-errors https://alexm3x.github.io/alex-global-currency-intelligence/data/macro-latest.json > /tmp/published-macro.json
          node -e "const fs=require('fs'); const expected=JSON.parse(fs.readFileSync('data/macro-latest.json')); const published=JSON.parse(fs.readFileSync('/tmp/published-macro.json')); if(published.generatedAt!==expected.generatedAt||published.overallStatus!==expected.overallStatus) process.exit(1);"
