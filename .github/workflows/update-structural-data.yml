name: Update AGCI structural data

on:
  schedule:
    - cron: "33 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-structural-data.mjs'
      - 'tests/structural-data.test.mjs'
      - '.github/workflows/update-structural-data.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  pages: write
  id-token: write

# Share the same deployment lock as pages.yml. This prevents two workflows
# from creating overlapping GitHub Pages deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run contract tests
        run: npm test
      - name: Fetch and validate official datasets
        run: npm run update:data
      - name: Validate generated contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const macro = JSON.parse(fs.readFileSync('data/macro-latest.json', 'utf8'));
          JSON.parse(fs.readFileSync('data/sources.json', 'utf8'));

          if (!['connected', 'degraded'].includes(macro.overallStatus)) {
            throw new Error(`Invalid overallStatus: ${macro.overallStatus}`);
          }

          const requiredProviders = ['worldBank', 'bis', 'cboe'];
          for (const key of requiredProviders) {
            const provider = macro.providers?.[key];
            if (!provider?.data) {
              throw new Error(`Structural provider ${key} has no usable current/previous snapshot`);
            }
          }

          const requiredEconomies = ['MX', 'US', 'XM', 'GB', 'JP', 'CN', 'BR'];
          for (const code of requiredEconomies) {
            const economy = macro.economies?.[code];
            if (!economy) throw new Error(`Missing economy ${code}`);
            for (const field of ['inflation', 'growth', 'policyRate', 'reer']) {
              if (!Number.isFinite(economy[field]?.value)) {
                throw new Error(`Missing/invalid ${field} for ${code}`);
              }
            }
          }

          if (!Number.isFinite(macro.risk?.vix)) {
            throw new Error('Missing/invalid VIX risk snapshot');
          }
          NODE
      - name: Publish changed observations
        run: |
          if git diff --quiet -- data/macro-latest.json data/sources.json; then
            echo "Official sources returned no material change."
            exit 0
          fi

          git config user.name "agci-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro-latest.json data/sources.json
          git commit -m "data: refresh structural indicators"

          # main may move while official datasets are being fetched. Rebase
          # and retry instead of treating a normal non-fast-forward race as a
          # structural-data failure.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict while publishing structural data."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying publish (${attempt}/5)..."
            sleep $((attempt * 3))
          done

          echo "Unable to publish structural observations after 5 retries."
          exit 1
      - name: Confirm structural snapshot on main
        run: |
          git fetch origin main
          git show origin/main:data/macro-latest.json > /tmp/remote-macro.json
          git show origin/main:data/sources.json > /tmp/remote-sources.json
          node <<'NODE'
          const fs = require('fs');
          const local = JSON.parse(fs.readFileSync('data/macro-latest.json', 'utf8'));
          const remote = JSON.parse(fs.readFileSync('/tmp/remote-macro.json', 'utf8'));
          const sources = JSON.parse(fs.readFileSync('/tmp/remote-sources.json', 'utf8'));

          if (!['connected', 'degraded'].includes(remote.overallStatus)) {
            throw new Error(`Remote structural status is ${remote.overallStatus}`);
          }
          if (Date.parse(remote.generatedAt) < Date.parse(local.generatedAt)) {
            throw new Error(`Remote snapshot is older than this run: ${remote.generatedAt} < ${local.generatedAt}`);
          }
          if (!['connected', 'degraded'].includes(sources.status)) {
            throw new Error(`Remote sources registry status is ${sources.status}`);
          }
          console.log(`Structural snapshot confirmed on main: ${remote.generatedAt} (${remote.overallStatus})`);
          NODE
      - name: Build clean Pages artifact
        run: |
          rm -rf /tmp/agci-pages
          mkdir -p /tmp/agci-pages
          git archive HEAD | tar -x -C /tmp/agci-pages
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/agci-pages
      - name: Deploy refreshed data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Confirm published structural snapshot
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node -e "const x=require('./data/macro-latest.json'); console.log('Expected published snapshot:', x.generatedAt, x.overallStatus)"
          base="${PAGE_URL%/}/data/macro-latest.json"
          echo "Verifying canonical Pages endpoint: ${base}"

          for attempt in $(seq 1 18); do
            url="${base}?run=${GITHUB_RUN_ID}&attempt=${attempt}"
            if curl --location --fail --silent --show-error --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "$url" > /tmp/published-macro.json; then
              if node <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('data/macro-latest.json', 'utf8'));
          const published = JSON.parse(fs.readFileSync('/tmp/published-macro.json', 'utf8'));
          const okStatus = ['connected', 'degraded'].includes(published.overallStatus);
          const newEnough = Date.parse(published.generatedAt) >= Date.parse(expected.generatedAt);
          if (!okStatus || !newEnough) process.exit(1);
          console.log(`Published structural snapshot confirmed: ${published.generatedAt} (${published.overallStatus})`);
          NODE
              then
                exit 0
              fi
            fi
            echo "Pages has not propagated the new structural snapshot yet (${attempt}/18)."
            sleep 5
          done

          echo "GitHub Pages did not expose the refreshed structural snapshot within 90 seconds."
          exit 1
