name: Update AGCI structural data

on:
  schedule:
    - cron: "33 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-structural-data.mjs'
      - 'tests/structural-data.test.mjs'
      - '.github/workflows/update-structural-data.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: agci-structural-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - name: Run contract tests
        run: npm test
      - name: Fetch and validate official datasets
        run: npm run update:data
      - name: Validate generated contracts
        run: |
          node -e "const fs=require('fs'); for (const file of ['data/macro-latest.json','data/sources.json']) JSON.parse(fs.readFileSync(file,'utf8'));"
          node -e "const x=require('./data/macro-latest.json'); if (!['connected','degraded'].includes(x.overallStatus)) process.exit(1); if (!Object.values(x.providers).some(p=>p.data)) process.exit(1);"
      - name: Publish changed observations
        run: |
          if git diff --quiet -- data/macro-latest.json data/sources.json; then
            echo "Official sources returned no material change."
            exit 0
          fi
          git config user.name "agci-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/macro-latest.json data/sources.json
          git commit -m "data: refresh structural indicators"
          git push
