name: Update AGCI Greed Valuation

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-greed-valuation-data.mjs'
      - 'scripts/update-valuation-market.py'
      - 'scripts/apply-valuation-to-greed.mjs'
      - 'tests/greed-valuation-data-engine.test.mjs'
      - 'greed-valuation-core.js'
      - '.github/workflows/update-greed-valuation.yml'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/update-greed-valuation-data.mjs'
      - 'scripts/update-valuation-market.py'
      - 'scripts/apply-valuation-to-greed.mjs'
      - 'tests/greed-valuation-data-engine.test.mjs'
      - 'greed-valuation-core.js'
      - '.github/workflows/update-greed-valuation.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: agci-greed-valuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install valuation dependencies
        run: python -m pip install --disable-pip-version-check pandas requests xlrd
      - name: Run repository tests
        run: npm test
      - name: Validate live Greed data engine
        run: node scripts/update-greed-valuation-data.mjs --dry-run
      - name: Generate valuation inputs
        run: python scripts/update-valuation-market.py
      - name: Generate production Greed snapshot
        if: github.event_name != 'pull_request'
        run: node scripts/update-greed-valuation-data.mjs
      - name: Apply valuation layer
        if: github.event_name != 'pull_request'
        run: node scripts/apply-valuation-to-greed.mjs
      - name: Validate valuation layer without write
        if: github.event_name == 'pull_request'
        run: |
          node scripts/update-greed-valuation-data.mjs
          node scripts/apply-valuation-to-greed.mjs --dry-run
      - name: Validate generated contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const latest=JSON.parse(fs.readFileSync('data/greed-valuation-latest.json','utf8'));
          const valuation=JSON.parse(fs.readFileSync('data/valuation-market-latest.json','utf8'));
          if(!Number.isFinite(latest.market?.greed)) throw new Error('Greed score unavailable');
          if((latest.market?.coverage?.greed ?? 0) < 0.60) throw new Error('Greed coverage below policy');
          if(!Number.isFinite(latest.market?.valuation)) throw new Error('Valuation score unavailable');
          if((latest.market?.coverage?.valuation ?? 0) < 0.55) throw new Error('Valuation coverage below policy');
          if(!Number.isFinite(latest.market?.confidence)) throw new Error('Confidence unavailable');
          for(const key of ['trailingPE','cape','earningsYieldSpread','equityRiskPremium']){
            const c=valuation.components?.[key];
            if(!Number.isFinite(c?.normalized_score)) throw new Error(`Missing valuation ${key} score`);
            if(!c?.source || !c?.asOf) throw new Error(`Missing valuation ${key} provenance`);
          }
          console.log(`Validated Greed ${latest.market.greed}/100 · Valuation ${latest.market.valuation}/100 · confidence ${latest.market.confidence}`);
          NODE
      - name: Publish changed observations
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/greed-valuation-latest.json data/greed-valuation-history.json data/valuation-market-latest.json; then
            echo "No Greed/Valuation observation changed materially."
            exit 0
          fi
          git config user.name "agci-greed-valuation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/greed-valuation-latest.json data/greed-valuation-history.json data/valuation-market-latest.json
          git commit -m "data: refresh greed valuation intelligence"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
