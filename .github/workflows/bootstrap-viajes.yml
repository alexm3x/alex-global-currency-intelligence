name: Bootstrap Viajes ASC rewrite

on:
  push:
    branches: [main]
    paths:
      - 'viajes/bootstrap_payload.part*'
      - '.github/workflows/bootstrap-viajes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-viajes-asc
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          count=$(find viajes -maxdepth 1 -name 'bootstrap_payload.part*' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Payload parts found: $count"
      - name: Install and refresh travel dashboard
        if: steps.payload.outputs.count == '5'
        shell: bash
        run: |
          set -euo pipefail
          cat viajes/bootstrap_payload.part* | base64 --decode > /tmp/viajes_payload.tgz
          tar -xzf /tmp/viajes_payload.tgz
          python -m py_compile viajes/scripts/update_intelligence.py
          python viajes/scripts/update_intelligence.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('viajes/data/destinations.json').read_text(encoding='utf-8'))
          destinations=data['destinations']
          assert data['meta']['schema_version']=='2.0.0'
          assert len(destinations)==20
          assert sum(item.get('kind') == 'cruise' for item in destinations) >= 5
          assert Path('viajes/index.html').read_text(encoding='utf-8').count('<canvas')==2
          print('Bootstrap validation passed')
          PY
      - name: Commit production files and remove bootstrap
        if: steps.payload.outputs.count == '5'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'viajes-asc-bootstrap'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viajes/index.html viajes/scripts/update_intelligence.py viajes/data/destinations.json .github/workflows/update_data.yml
          git rm viajes/bootstrap_payload.part* .github/workflows/bootstrap-viajes.yml
          git commit -m 'feat: rebuild Viajes ASC autonomous terminal'
          git pull --rebase origin main
          git push origin main
