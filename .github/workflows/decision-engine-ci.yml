name: AGCI Decision Engine CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-engine-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Decision Engine syntax
        run: |
          node --check decision-engine-core.js
          node --check decision-engine.js
          node --check decision-evidence-core.js
          node --check decision-evidence.js
          node --check decision-learning-core.js
          node --check decision-variable-core.js
          node --check decision-evolution.js
          node --check scripts/parse-ibkr-ratings.mjs
          node --check scripts/capture-decision-snapshot.mjs
      - name: Run repository test suite
        run: npm test
      - name: Validate production integration
        run: |
          test -s decision-engine-core.js
          test -s decision-engine.js
          test -s decision-engine.css
          test -s decision-evidence-core.js
          test -s decision-evidence.js
          test -s decision-evidence.css
          test -s decision-learning-core.js
          test -s decision-variable-core.js
          test -s decision-evolution.js
          test -s decision-evolution.css
          test -s data/ciar-latest.json
          test -s data/decision-learning-latest.json
          test -s data/decision-variable-registry.json
          test -s .github/workflows/decision-learning.yml
          grep -q 'data-view="decisionEngine"' index.html
          grep -q 'id="decisionEngine"' index.html
          grep -q 'decision-engine.css' index.html
          grep -q 'decision-engine.js' index.html
          grep -q 'Preparation Score' decision-engine.js
          grep -q 'Terreno de Compra AGCI' decision-engine.js
          grep -q 'rankRadar' decision-engine-core.js
          grep -q 'decision-evidence.js' nav-dedupe.js
          grep -q 'decision-evolution.js' nav-dedupe.js
          grep -q 'data/ciar-latest.json' decision-evidence.js
          grep -q 'data/daily-briefing-latest.json' decision-evidence.js
          grep -q 'data/macro-latest.json' decision-evidence.js
          grep -q 'changesFairValue: false' decision-evidence-core.js
          grep -q 'data/decision-learning-latest.json' decision-evolution.js
          grep -q 'data/decision-variable-registry.json' decision-evolution.js
          grep -q 'minimumObservationsForMeasurement' decision-learning-core.js
          grep -q "state !== 'promoted'" decision-variable-core.js
      - name: Validate local static serving
        run: |
          python3 -m http.server 8766 >/tmp/agci-decision-engine.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8766/ > /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-engine.js > /tmp/decision-engine.js
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-engine-core.js > /tmp/decision-engine-core.js
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-engine.css > /tmp/decision-engine.css
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-evidence.js > /tmp/decision-evidence.js
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-evidence-core.js > /tmp/decision-evidence-core.js
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-evidence.css > /tmp/decision-evidence.css
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-evolution.js > /tmp/decision-evolution.js
          curl --fail --silent --show-error http://127.0.0.1:8766/decision-evolution.css > /tmp/decision-evolution.css
          curl --fail --silent --show-error http://127.0.0.1:8766/data/ciar-latest.json > /tmp/ciar.json
          curl --fail --silent --show-error http://127.0.0.1:8766/data/decision-learning-latest.json > /tmp/learning.json
          curl --fail --silent --show-error http://127.0.0.1:8766/data/decision-variable-registry.json > /tmp/registry.json
          grep -q 'Motor de Decisión' /tmp/index.html
          grep -q 'Preparar decisión' /tmp/decision-engine.js
          grep -q 'fairValueEstimate' /tmp/decision-engine-core.js
          grep -q '@media(max-width:430px)' /tmp/decision-engine.css
          grep -q 'FASE 3' /tmp/decision-evidence.js
          grep -q 'buildContextOverlay' /tmp/decision-evidence-core.js
          grep -q '@media(max-width:430px)' /tmp/decision-evidence.css
          grep -q 'FASE 4 · LEARNING LOOP' /tmp/decision-evolution.js
          grep -q 'FASE 5 · VARIABLE GOVERNANCE' /tmp/decision-evolution.js
          grep -q '@media(max-width:430px)' /tmp/decision-evolution.css
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/ciar.json'));
          const l=JSON.parse(fs.readFileSync('/tmp/learning.json'));
          const r=JSON.parse(fs.readFileSync('/tmp/registry.json'));
          if(![1,2].includes(c.schemaVersion)||!Array.isArray(c.records)||c.records.length<8)process.exit(1);
          if(l.schemaVersion!==1||!l.methodology)process.exit(1);
          if(r.schemaVersion!==1||!Array.isArray(r.variables))process.exit(1);
          NODE
      - name: Validate live fundamentals service
        run: |
          curl --fail --silent --show-error --max-time 20 https://agci-equity-fundamentals.proadmexico.workers.dev/health > /tmp/equity-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/equity-health.json'));if(x.status!=='ok'||x.service!=='agci-equity-fundamentals')process.exit(1)"
      - name: Validate live decision snapshot pipeline without publishing
        run: |
          node scripts/capture-decision-snapshot.mjs > /tmp/decision-learning-capture.json
          node - <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('/tmp/decision-learning-capture.json','utf8'));
          if(result.decisions<1)process.exit(1);
          if(!['collecting-history','learning-active'].includes(result.status))process.exit(1);
          const files=fs.readdirSync('data/decision-history').filter(x=>x.endsWith('.json'));
          if(!files.length)process.exit(1);
          NODE
