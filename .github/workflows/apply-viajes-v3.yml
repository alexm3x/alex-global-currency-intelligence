name: Apply Viajes ASC v3 upgrade

on:
  push:
    branches: [main]
    paths:
      - 'viajes/enhancements.js'
      - 'viajes/scripts/apply_v3_upgrade.py'
      - '.github/workflows/apply-viajes-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-viajes-v3
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply frontend and pipeline upgrade
        run: |
          sed -i 's/parents\[2\]/parents[1]/' viajes/scripts/apply_v3_upgrade.py
          python viajes/scripts/apply_v3_upgrade.py

      - name: Compile and regenerate intelligence
        run: |
          python -m py_compile viajes/scripts/update_intelligence.py
          python viajes/scripts/update_intelligence.py

      - name: Validate production contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = Path('viajes/index.html').read_text(encoding='utf-8')
          data = json.loads(Path('viajes/data/destinations.json').read_text(encoding='utf-8'))
          destinations = data['destinations']

          assert data['meta']['schema_version'] == '2.0.0'
          assert len(destinations) == 20
          assert sum(item.get('kind') == 'cruise' for item in destinations) >= 5
          assert all(item.get('traffic_light') in {'green', 'amber', 'red'} for item in destinations)
          assert all(len(item.get('fx_trend', [])) >= 12 for item in destinations)
          assert all(len(item.get('news', [])) >= 2 for item in destinations)
          assert all(
              article.get('impact') in {'high', 'medium', 'low'}
              for item in destinations
              for article in item.get('news', [])
          )
          assert '<script src="enhancements.js"></script>' in index
          assert Path('viajes/enhancements.js').stat().st_size > 10000
          print('Viajes ASC v3 production contract valid')
          PY

      - name: Commit validated production files
        run: |
          set -euo pipefail
          git config user.name 'viajes-asc-v3-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viajes/index.html viajes/enhancements.js viajes/scripts/update_intelligence.py viajes/data/destinations.json
          git rm -f viajes/scripts/apply_v3_upgrade.py
          if git diff --cached --quiet; then
            echo 'No production changes detected.'
            exit 0
          fi
          git commit -m 'feat: upgrade Viajes ASC charts and geopolitical news'
          git pull --rebase origin main
          git push origin main
