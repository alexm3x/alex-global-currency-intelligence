name: AGCI Voice Studio QA

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "voice-router.js"
      - "voice-studio.js"
      - "pronunciation-dictionary.json"
      - "scripts/test-voice-studio.mjs"
      - "sw.js"
      - "index.html"
      - ".github/workflows/voice-studio-qa.yml"
  push:
    branches:
      - "feat/morning-intelligence-voice-studio-*"
    paths:
      - "voice-router.js"
      - "voice-studio.js"
      - "pronunciation-dictionary.json"
      - "scripts/test-voice-studio.mjs"
      - "sw.js"
      - "index.html"
      - ".github/workflows/voice-studio-qa.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis y contrato Voice Studio
        run: |
          node --check voice-router.js
          node --check voice-studio.js
          node --check scripts/test-voice-studio.mjs
          node scripts/test-voice-studio.mjs
      - name: Resumen
        run: |
          echo "### AGCI Voice Studio — QA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Perfiles: 5" >> "$GITHUB_STEP_SUMMARY"
          echo "- Velocidades: 0.9x a 2x" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duraciones/enfoques: 8" >> "$GITHUB_STEP_SUMMARY"
          echo "- TTS premium: NO activado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fallback: voz local → audio publicado → transcripción" >> "$GITHUB_STEP_SUMMARY"
