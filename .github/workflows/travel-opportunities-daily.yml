name: Viajes ASC opportunity import

on:
  schedule:
    - cron: "15 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viajes-opportunity-import
  cancel-in-progress: false

jobs:
  import-opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-opportunities.txt
      - run: pip install -r requirements-opportunities.txt
      - name: Procesar HTML autorizado
        env:
          OPPORTUNITIES_SOURCE: ${{ vars.OPPORTUNITIES_SOURCE }}
        run: python viajes/scripts/scrape_opportunities.py --source "${OPPORTUNITIES_SOURCE:-viajes/oportunidades.html}"
      - name: Publicar datos si cambiaron
        run: |
          if git diff --quiet -- viajes/data/data_dashboard.csv viajes/data/data_dashboard.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viajes/data/data_dashboard.csv viajes/data/data_dashboard.json
          git commit -m "data: refresh travel opportunities"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict while publishing travel opportunities."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying publish (${attempt}/5)..."
            sleep $((attempt * 3))
          done
          echo "Unable to publish travel opportunities after 5 retries."
          exit 1
