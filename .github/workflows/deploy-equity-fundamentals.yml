name: Deploy AGCI Equity Fundamentals
on:
  push:
    branches:
      - main
      - feat/agci-decision-engine-20260810
    paths:
      - 'cloudflare/agci-equity-fundamentals.js'
      - 'wrangler.equity-fundamentals.jsonc'
      - '.github/workflows/deploy-equity-fundamentals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN is not configured' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID is not configured' && exit 1)
          test -n "$TWELVE_DATA_API_KEY" || (echo 'TWELVE_DATA_API_KEY is not configured' && exit 1)
      - name: Install and test
        run: |
          npm ci
          npm test
          npx wrangler deploy --dry-run --config wrangler.equity-fundamentals.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.equity-fundamentals.jsonc
      - name: Configure Twelve Data secret
        run: printf '%s' "$TWELVE_DATA_API_KEY" | npx wrangler secret put TWELVE_DATA_API_KEY --config wrangler.equity-fundamentals.jsonc
      - name: Validate production health
        run: |
          sleep 3
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --max-time 20 https://agci-equity-fundamentals.proadmexico.workers.dev/health > /tmp/equity-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/equity-health.json'));if(x.status!=='ok'||x.service!=='agci-equity-fundamentals'||x.priceProvider!=='Twelve Data')process.exit(1)"
      - name: Validate production comparison contract
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 45 'https://agci-equity-fundamentals.proadmexico.workers.dev/compare?symbols=MSFT,GOOGL' > /tmp/equity-compare.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/equity-compare.json'));if(x.contractVersion!=='1.0.0'||!Array.isArray(x.analyses)||!x.analyses.length)process.exit(1)"
